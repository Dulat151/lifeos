# Render Blueprint: dashboard.render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: lifeos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lifeos-redis
          property: connectionString

  - type: keyvalue
    name: lifeos-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos
    user: lifeos
