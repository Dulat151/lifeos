# LIFE OS — full stack: PostgreSQL, Redis, API, migrations, Celery worker + beat (reminders), Next.js web.
# Usage:  cp .env.example .env  &&  docker compose up -d --build   ->  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: ./backend
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifeos}
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    volumes: [uploads:/app/storage/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    restart: unless-stopped
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  uploads:
